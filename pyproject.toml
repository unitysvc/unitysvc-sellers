[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unitysvc-sellers"
version = "0.3.1"
description = "Seller-facing tools for UnitySVC: HTTP SDK + `usvc seller` CLI"
readme = "README.md"
authors = [{ name = "Bo Peng", email = "bo.peng@unitysvc.com" }]
maintainers = [{ name = "Bo Peng", email = "bo.peng@unitysvc.com" }]
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
  # 0.2.21 is the floor for provider-account rate-limit buckets:
  # ProviderAccountRateLimit.name is required so upstream channels can reference
  # seller-scoped buckets via rate_limit_refs / ops_rate_limit_refs.
  "unitysvc-core>=0.2.21",
  # Ships the `usvc` umbrella that mounts the usvc.commands entry point below,
  # so `usvc seller ...` works for anyone who installs this package. Adds no new
  # transitive dependencies — typer, rich, httpx, attrs and python-dateutil are
  # all already required here.
  "unitysvc-py>=0.1.22",
  "unitysvc-data>=0.1.28",
  "typer",
  "rich",
  "jinja2",
  "json5",
  "tomli-w",
  # Markdown processing
  "mistune>=3.0",
  # Seller HTTP SDK
  "httpx>=0.24",
  "attrs>=23.0",
  "python-dateutil>=2.8",
  "Pillow>=10.0",
]
requires-python = ">= 3.11"

[project.optional-dependencies]
test = [
  "coverage",
  "pytest",
  "pytest-asyncio",
  "ruff",
  "mypy",
  "respx",
]
dev = [
  "coverage",
  "pytest",
  "ruff",
  "ty",
  "ipdb",
]
docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocs-autorefs",
  "mkdocstrings[python]",
  "pymdown-extensions",
]

[project.urls]
bugs = "https://github.com/unitysvc/unitysvc-sellers/issues"
homepage = "https://github.com/unitysvc/unitysvc-sellers"

[project.scripts]
# Kept for backward compatibility: ~640 files across the org (docs, CI
# workflows, CLAUDE.md) invoke this name. `usvc seller` is the spelling to use.
usvc_seller = "unitysvc_sellers.cli:app"

# Advertised to the `usvc` umbrella (unitysvc-py), which mounts whatever it finds
# in this group as a subcommand: `usvc seller specs validate`. Inert metadata
# when unitysvc-py is absent — nothing reads the group, nothing is imported.
[project.entry-points."usvc.commands"]
seller = "unitysvc_sellers.cli:app"

[tool.ruff]
line-length = 120
# openapi-python-client produces its own idiosyncratic formatting.
# Excluding keeps regenerations byte-stable — no post-processing
# step, no drift between the spec and the committed client.
extend-exclude = ["src/unitysvc_sellers/_generated"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "UP", # pyupgrade
]
ignore = [
  "B008", # Typer pattern uses function calls in argument defaults
  "B904",
]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["import-untyped"]

[tool.uv]
package = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
unitysvc_sellers = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
